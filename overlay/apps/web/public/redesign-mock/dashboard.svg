<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="system-ui,sans-serif">
  <!-- Planted image for the redesign preview: the dashboard the orbit-dashboard repo builds. -->
  <rect width="660" height="440" fill="#171c27"/>
  <text x="40" y="56" font-size="26" font-weight="700" fill="#eef2fb">Orbit</text>
  <text x="122" y="56" font-size="14" fill="#8d99b2">Times in UTC</text>
  <rect x="40" y="88" width="180" height="120" rx="14" fill="#232a3a" stroke="#344056"/><text x="60" y="122" font-size="15" fill="#8d99b2">Visits</text><text x="60" y="172" font-size="34" font-weight="600" fill="#eef2fb">26.9K</text>
  <rect x="236" y="88" width="180" height="120" rx="14" fill="#232a3a" stroke="#344056"/><text x="256" y="122" font-size="15" fill="#8d99b2">Sign-ups</text><text x="256" y="172" font-size="34" font-weight="600" fill="#eef2fb">865</text>
  <rect x="432" y="88" width="180" height="120" rx="14" fill="#232a3a" stroke="#344056"/><text x="452" y="122" font-size="15" fill="#8d99b2">Bounce rate</text><text x="452" y="172" font-size="34" font-weight="600" fill="#eef2fb">38.3%</text>
  <rect x="40" y="240" width="572" height="168" rx="14" fill="#1e2433" stroke="#344056"/>
  <text x="56" y="276" font-size="14" fill="#8d99b2">Visits by region</text>
  <text x="56" y="318" font-size="15" fill="#c9d1e1">Europe</text><rect x="220" y="305" width="281" height="14" rx="7" fill="#6e8efb"/>
  <text x="56" y="352" font-size="15" fill="#c9d1e1">North America</text><rect x="220" y="339" width="360" height="14" rx="7" fill="#6e8efb"/>
  <text x="56" y="386" font-size="15" fill="#c9d1e1">Asia Pacific</text><rect x="220" y="373" width="223" height="14" rx="7" fill="#6e8efb"/>
  <text x="620" y="430" font-size="11" text-anchor="end" fill="#5d6a84">planted image</text>
</svg>
